[workspace]
resolver = "2"
members = [
  "apps/desktop",
  "crates/agents",
  "crates/app",
  "crates/avatars",
  "crates/collectors",
  "crates/domain",
  "crates/storage",
  "crates/ui",
  ".rune/vendor/accesskit_macos",
  ".rune/vendor/accesskit_windows",
  ".rune/vendor/parley_engine",
  ".rune/vendor/wgpu-hal",
  ".rune/vendor/winit",
]
# Vendored Rune patches are members so Turborepo can hash and validate them,
# but they are not part of this project's normal default build.
default-members = [
  "apps/desktop",
  "crates/agents",
  "crates/app",
  "crates/avatars",
  "crates/collectors",
  "crates/domain",
  "crates/storage",
  "crates/ui",
]

[workspace.metadata]
name = "coderune"

[workspace.package]
version = "0.3.30"
edition = "2021"
license = "AGPL-3.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
sea-orm = { version = "2.0.4", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
] }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

coderune-agents = { path = "crates/agents" }
coderune-app = { path = "crates/app" }
coderune-avatars = { path = "crates/avatars" }
coderune-collectors = { path = "crates/collectors" }
coderune-domain = { path = "crates/domain" }
coderune-storage = { path = "crates/storage" }
rune = { git = "https://github.com/anomalyco/rune", rev = "8fc71fbf21db41920409bf6fa20ffb41ddb2f99d", features = [
  "native-file-dialog",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "8fc71fbf21db41920409bf6fa20ffb41ddb2f99d" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "8fc71fbf21db41920409bf6fa20ffb41ddb2f99d" }
coderune-ui = { path = "crates/ui" }

[patch.crates-io]
wgpu-hal = { path = ".rune/vendor/wgpu-hal" }
winit = { path = ".rune/vendor/winit" }
parley_engine = { path = ".rune/vendor/parley_engine" }
accesskit_windows = { path = ".rune/vendor/accesskit_windows" }
accesskit_macos = { path = ".rune/vendor/accesskit_macos" }

[profile.dev]
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
