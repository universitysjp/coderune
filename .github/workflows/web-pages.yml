name: Publish web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/web-pages.yml
      - apps/web/**
      - packages/**
      - bun.lock
      - package.json
      - vite.config.ts
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: bun
        name: Read the workspace Bun version
        run: |
          version=$(jq -er '.devEngines.packageManager.version' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build the website
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run --cwd apps/web build --base "${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
